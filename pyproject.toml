[project]
name = "codey"
version = "0.1.0"
description = "Local-first developer project memory and understanding tool"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "gitpython>=3.1.43,<4",
  "gitignore-parser>=0.1.11,<1",
  "pydantic>=2.9,<3",
  "rich>=13.9,<15",
  "typer>=0.16,<1",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-python>=0.25,<1",
  "tree-sitter-javascript>=0.25,<1",
  "tree-sitter-typescript>=0.23,<1",
  "tree-sitter-java>=0.23,<1",
  "tree-sitter-go>=0.25,<1",
  "tree-sitter-rust>=0.24,<1",
]

[project.scripts]
codey = "codey.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codey"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
