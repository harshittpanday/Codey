[project]
name = "codey"
version = "0.2.0"
description = "CodeY — local-first codebase understanding with local AI."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["gitpython>=3.1.59","gitignore-parser>=0.1.13","pydantic>=2.13","rich>=14.3","tree-sitter>=0.25","tree-sitter-go>=0.25","tree-sitter-java>=0.23","tree-sitter-javascript>=0.25","tree-sitter-python>=0.25","tree-sitter-rust>=0.24","tree-sitter-typescript>=0.23","typer>=0.27","httpx>=0.28"]
[project.optional-dependencies]
dev = ["pytest>=8.4","pytest-cov>=7.0"]
[project.scripts]
codey = "codey.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/codey"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
]
